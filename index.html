<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>S.O.S. Servicios | Código QR</title>
  <meta name="description" content="Código QR de presentación rápida para colaboradores de S.O.S. Servicios.">

  <!-- PWA & Mobile Web App Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SOS QR">

  <!-- Iconos -->
  <link rel="icon" type="image/webp" href="img/SOSLogoSinFondo.webp">
  <link rel="apple-touch-icon" href="img/SOSLogoSinFondo.webp">

  <!-- Tipografía Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">

  <!-- Font Awesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Estilos -->
  <link rel="stylesheet" href="custom.css">
</head>

<body class="qr-screen">

  <main class="app-wrapper qr-clean-wrapper">

    <!-- Logo Oficial de la Empresa -->
    <header class="qr-header-logo">
      <img src="img/SOSLogoSinFondo.webp" alt="S.O.S. Servicios" class="company-logo" id="mainLogo">
    </header>

    <!-- Tarjeta del Código QR -->
    <section class="qr-card-container">
      <div class="qr-card" id="qrCardElement">
        <!-- Contenedor donde se genera el QR -->
        <div id="qrcode"></div>

        <div class="qr-scan-instruction">
          <span class="scan-dot"></span>
          <span>Apunta con la cámara de tu celular</span>
        </div>
      </div>

    </section>

    <!-- Acciones Rápidas para el Colaborador -->
    <section class="collaborator-actions">
      <!-- Botón para ver directamente la tarjeta de presentación -->
      <a href="tarjetapresentacion.html" class="btn-primary" id="openCardDirectBtn">
        <i class="fa-solid fa-eye"></i> Ver Tarjeta de Presentación
      </a>

      <!-- Botón para compartir enlace directo -->
      <button type="button" class="btn-secondary" id="shareQrLinkBtn">
        <i class="fa-solid fa-share-nodes"></i> Compartir Enlace Directo
      </button>
    </section>

  </main>

  <!-- Banner de Instalación PWA (Pantalla de Inicio) -->
  <aside class="install-banner" id="pwaInstallBanner" style="display: none;">
    <div class="install-banner-left">
      <img src="img/SOSLogoSinFondo.webp" alt="Icono" class="install-app-icon">
      <div class="install-banner-text">
        <h5>Tener como App en el Inicio</h5>
        <p>Abre el QR rápidamente con un solo toque</p>
      </div>
    </div>
    <div class="install-banner-actions">
      <button type="button" class="btn-install" id="btnInstallPWA">Instalar</button>
      <button type="button" class="btn-dismiss" id="btnDismissPWA" aria-label="Cerrar">✕</button>
    </div>
  </aside>

  <!-- Scripts: Librería QR independiente y Lógica de la App -->
  <script src="qrcode.min.js"></script>
  <script src="javascript.js"></script>
</body>

</html>
